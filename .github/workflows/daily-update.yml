name: 水俣市くらしナビ 自動更新・デプロイ

on:
  schedule:
    - cron: "0 22 * * *" # 毎朝 7:00 JST
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - ".github/workflows/daily-update.yml"

# 既定は読み取りのみ。必要な権限はジョブごとに付ける
permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write # データ更新のpush
      issues: write   # 失敗時のIssue起票
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    outputs:
      changed: ${{ steps.git-check.outputs.changed }}
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Python セットアップ
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: 依存関係インストール
        run: pip install -r scripts/requirements.txt

      - name: 生活情報を収集・更新
        id: run-update
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/update_data.py

      # イベントタブ用（設計書 docs/agent-notes/design-specs/2026-09-21_events-tab.md）。
      # 生活情報の収集が失敗しても、既存の life_info.json を使ってイベント一覧は更新する。
      # スクリプト自体の失敗ではIssueを起票しない（翌日また自動で再試行される）。
      # スプレッドシート（手動登録・投稿フォーム）を読み込めなかったときだけ、sheet_error=true が出力され、
      # 下のステップでIssueを起票する（設計書 docs/agent-notes/design-specs/2026-09-28_event-submission-form.md）。
      - name: イベント情報を更新
        id: run-events
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EVENTS_SHEET_CSV_URL: ${{ vars.EVENTS_SHEET_CSV_URL }}
          EVENTS_FORM_CSV_URL: ${{ vars.EVENTS_FORM_CSV_URL }}
        run: python scripts/update_events.py

      # カレンダー作成（設計書 docs/agent-notes/design-specs/2026-11-11_event-calendar.md）
      # events.json から events.ics と ics/<id>.ics を作成する
      - name: カレンダー情報を作成
        id: run-calendar
        continue-on-error: true
        run: python scripts/build_calendar.py

      - name: 変更を検出
        id: git-check
        run: |
          if [ -z "$(git status --porcelain -- public/data/life_info.json public/data/_checked_urls.json public/data/events.json public/data/_events_auto.json public/data/_events_manual.json public/data/_events_form.json public/data/_events_koho.json public/data/events.ics 'public/data/events-*.ics' public/data/ics)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 変更をコミット・push
        if: steps.git-check.outputs.changed == 'true'
        run: |
          git config user.name "life-info-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/data/life_info.json public/data/_checked_urls.json public/data/events.json public/data/_events_auto.json
          # _events_manual.json はスプレッドシートのURLが未設定の間は作られないため、存在するときだけ追加する
          if [ -f public/data/_events_manual.json ]; then git add public/data/_events_manual.json; fi
          if [ -f public/data/_events_form.json ]; then git add public/data/_events_form.json; fi
          if [ -f public/data/_events_koho.json ]; then git add public/data/_events_koho.json; fi
          if [ -f public/data/events.ics ]; then git add public/data/events.ics; fi
          git add public/data/events-*.ics 2>/dev/null || true
          if [ -d public/data/ics ]; then git add -A public/data/ics; fi
          git commit -m "chore: 生活情報を自動更新 ($(date -u +'%Y-%m-%dT%H:%M:%SZ'))"

          # このジョブは実行に十数分かかるため、その間に他のpush（手動実行や
          # 他のワークフロー）が先にmainへ反映されると、単純なgit pushは
          # non-fast-forwardで失敗する。pull --rebaseしてから再試行する。
          for i in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "push失敗。pull --rebaseしてリトライします ($i/5)"
            git pull --rebase origin main
            sleep $((i * 5))
          done
          echo "::error::5回リトライしてもpushに失敗しました。"
          exit 1

      # デプロイを止めないよう、ワークフローは失敗にしない（前回読み込めた内容で表示を続ける）
      - name: イベントシートの読み込み失敗をIssueとして起票（既存Issueがあれば更新）
        if: steps.run-events.outputs.sheet_error == 'true'
        uses: JasonEtco/create-an-issue@1b14a70e4d8dc185e5cc76d3bec9eab20257b2c5 # v2.9.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHEET_ERROR_DETAIL: ${{ steps.run-events.outputs.sheet_error_detail }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          filename: .github/workflow-templates/events-sheet-failure-issue.md
          update_existing: true

      # 広報みなまた自動抽出の異常検知時（一覧取得失敗3日連続、最新号が2か月以上古い、全ページ処理で0件）
      # デプロイを止めないよう、ワークフローは失敗にしない（既存のキャッシュで表示を続ける）
      - name: 広報の自動抽出エラーをIssueとして起票（既存Issueがあれば更新）
        if: steps.run-events.outputs.koho_error == 'true'
        uses: JasonEtco/create-an-issue@1b14a70e4d8dc185e5cc76d3bec9eab20257b2c5 # v2.9.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KOHO_ERROR_DETAIL: ${{ steps.run-events.outputs.koho_error_detail }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          filename: .github/workflow-templates/koho-failure-issue.md
          update_existing: true

      - name: Issueテンプレート用の情報を準備
        if: steps.run-update.outcome == 'failure'
        run: |
          echo "RUN_DATE=$(TZ=Asia/Tokyo date +'%Y-%m-%d %H:%M JST')" >> "$GITHUB_ENV"
          echo "RUN_URL=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> "$GITHUB_ENV"

      - name: エラーをIssueとして起票（既存Issueがあれば更新）
        if: steps.run-update.outcome == 'failure'
        uses: JasonEtco/create-an-issue@1b14a70e4d8dc185e5cc76d3bec9eab20257b2c5 # v2.9.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          filename: .github/workflow-templates/collection-failure-issue.md
          update_existing: true

      - name: 収集処理の失敗をワークフローに反映
        if: steps.run-update.outcome == 'failure'
        run: |
          echo "::error::生活情報の収集処理が失敗しました。詳細はIssueを確認してください。"
          exit 1

  # 組み立て・アップロード（build）とデプロイ（deploy）は別ジョブに分ける。
  # 同じジョブで続けて実行すると、アップロード直後のアーティファクトを
  # deploy-pages が見つけられず「No artifacts named "github-pages"」で
  # 失敗することがある（actions/deploy-pages#451。2026-11-22〜23に3回発生）。
  # 別ジョブにすると検索が数秒後になり、失敗しても deploy ジョブだけの
  # 再実行でアーティファクトが重複しない。
  build:
    needs: update-data
    permissions:
      contents: read
    if: always() && (needs.update-data.result == 'skipped' || success())
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main

      # public/ 全体をコピーする（data/ に加えて、ホーム画面に追加するための
      # manifest.webmanifest と icons/ を公開する。設計書
      # docs/agent-notes/design-specs/2026-10-01_add-to-home-screen.md）。
      - name: サイトを dist/ に組み立て
        run: |
          mkdir -p dist
          cp src/index.html dist/index.html
          cp -r public/. dist/

      - name: Pages 用アーティファクトをアップロード
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: dist

  deploy:
    needs: build
    # push のときは update-data がスキップされる。条件を書かないと、
    # その「スキップ」が引き継がれて deploy もスキップされるので明示する。
    if: always() && needs.build.result == 'success'
    permissions:
      pages: write    # Pagesへのデプロイ
      id-token: write # Pagesへのデプロイ
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: GitHub Pages にデプロイ
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
